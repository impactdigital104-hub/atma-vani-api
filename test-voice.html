<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Atma Vani — Voice MVP (Step 5: Language Match)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{--bg:#0e0f13;--card:#151824;--text:#e9eef7;--muted:#a9b3c7;--accent:#6ea8fe;--good:#27c093;--bad:#ff6b6b;--warn:#ffb020;--border:#23273a}
    html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0}
    .wrap{max-width:960px;margin:40px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    h1{font-size:24px;margin:0 0 6px}.sub{margin:0 0 20px;color:var(--muted)}
    .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    button{appearance:none;border:1px solid var(--border);background:#1b2030;color:var(--text);padding:12px 16px;border-radius:12px;cursor:pointer;font-size:15px;transition:.15s}
    button:hover{background:#1e2538}.primary{background:var(--accent);color:#0b1220;border-color:transparent}
    .
