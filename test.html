<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atma Vani Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body{font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px;}
      .wrap{max-width: 900px; margin: 0 auto;}
      textarea{width:100%; height:120px; padding:10px; font-size:16px;}
      button{padding:8px 14px; font-size:16px; cursor:pointer;}
      pre{white-space:pre-wrap; background:#fffdfa; padding:12px; border:1px solid #f2e6d6; border-radius:8px;}
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Atma Vani Test</h1>
      <textarea id="q" placeholder="Ask something about Hindu spirituality..."></textarea>
      <br><br>
      <button id="go">Ask</button>
      <br><br>
      <pre id="out"></pre>
    </div>
 <script>
const API_URL = './api/chat';
const btn = document.getElementById('go');
const out = document.getElementById('out');

btn.onclick = async () => {
  out.textContent = 'Sending...';
  const message = document.getElementById('q').value.trim();
  if (!message) { out.textContent = 'Type a question first.'; return; }

  try {
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message })
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = { reply: text }; }
    out.textContent = data.reply || 'No reply.';
  } catch (e) {
    out.textContent = 'Network error: ' + e.message;
  }
};
</script>
  </body>
</html>
