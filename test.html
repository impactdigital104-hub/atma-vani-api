<!doctype html>
<meta charset="utf-8">
<title>Atma Vani Test</title>
<div style="max-width:600px;margin:40px auto;font-family:system-ui">
  <h3>Atma Vani Test</h3>
  <textarea id="q" rows="4" style="width:100%;"></textarea><br><br>
  <button id="go">Ask</button>
  <pre id="out" style="white-space:pre-wrap;margin-top:16px;"></pre>
</div>
<script>
const API_URL = './api/chat';

const btn = document.getElementById('go');
const out = document.getElementById('out');

btn.onclick = async () => {
  out.textContent = 'Sending...';
  const message = document.getElementById('q').value.trim();
  if (!message) { out.textContent = 'Type a question first.'; return; }

  try {
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message })
    });
    const data = await res.json();

    // Show everything so it's easy to read
    out.textContent =
      'Reply:\n' + (data.reply || '') + '\n\n' +
      'Theme: ' + (data.theme || '—') + '\n' +
      'Logged to Firestore: ' + (data.logged ? 'YES' : 'NO') + '\n' +
      (data.logError ? ('Log error: ' + data.logError) : '');
  } catch (e) {
    out.textContent = 'Error: ' + e.message;
  }
};
</script>
